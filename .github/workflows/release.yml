name: Build & Release

# 推一个 v* 标签就自动打包并挂到 Release；也可以在 Actions 页面手动触发只构建不上传
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 打包 exe
        run: python -m PyInstaller --noconfirm --clean CtrlCFlash.spec

      - name: 检查产物
        shell: pwsh
        run: |
          if (-not (Test-Path dist/CtrlCFlash.exe)) { throw "没有生成 dist/CtrlCFlash.exe" }
          $item = Get-Item dist/CtrlCFlash.exe
          $mb = [math]::Round($item.Length / 1MB, 1)
          Write-Host "产物大小: $mb MB"
          if ($mb -gt 32) {
            Write-Host "::warning::产物 $mb MB，明显超过预期的 25MB 左右，spec 里的裁剪可能没生效（PySide6 版本变化会导致文件名对不上）"
          }
          $hash = (Get-FileHash dist/CtrlCFlash.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          $line = "| CtrlCFlash.exe | " + $mb + " MB | " + [char]96 + $hash + [char]96 + " |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| 产物 | 大小 | SHA-256 |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| --- | --- | --- |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CtrlCFlash-exe
          path: dist/CtrlCFlash.exe
          retention-days: 30

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag 不存在，创建中..."
            gh release create $tag --repo "${{ github.repository }}" --title "$tag" --generate-notes
          }
          gh release upload $tag dist/CtrlCFlash.exe --clobber --repo "${{ github.repository }}"
